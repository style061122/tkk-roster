<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>門市招募管理系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; background-color: #2c3e50; color: white; padding: 15px 20px; border-radius: 8px; }
        .card-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .job-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; border-top: 4px solid #3498db; }
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; background-color: #e8f5e9; color: #2e7d32; }
    </style>
</head>
<body>

    <div class="dashboard-header">
        <h2 style="margin: 0;">HR 招募系統 - 門市端</h2>
        <!-- 模擬登入狀態：實務上這裡會動態帶入帳號權限 -->
        <div id="store-identity">📍 目前身分：桃園機場店</div>
    </div>

    <h3 style="margin-top: 30px;">📋 我的開放職缺</h3>
    <div id="job-container" class="card-container">
        <p>載入資料中，請稍候...</p>
    </div>

    <script>
        // 替換為您的 GAS 部署網址
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxVBA8yw9HzQem86swcgWVFs16J-QOOCIFkM4LQOml2nMoTrm3Qc2MFNQSlHLoTVQg/exec"; 
        
        // 模擬當前登入的店長權限
        const currentStore = "桃園機場店"; 

        fetch(GAS_URL)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById("job-container");
                container.innerHTML = ""; // 清空載入中提示
                
                // 核心邏輯：只過濾出屬於自己的門市職缺
                const myJobs = data.filter(job => job["所屬門市"] === currentStore);
                
                if (myJobs.length === 0) {
                    container.innerHTML = "<p>目前沒有專屬職缺。</p>";
                    return;
                }

                myJobs.forEach(job => {
                    const card = document.createElement("div");
                    card.className = "job-card";
                    card.innerHTML = `
                        <div class="status-badge">${job["狀態"]}</div>
                        <h4 style="margin: 15px 0 5px 0;">${job["職缺名稱"]}</h4>
                        <p style="color: #7f8c8d; font-size: 14px; margin: 0 0 15px 0;">ID: ${job["職缺編號"]}</p>
                        <button style="width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">
                            查看應徵者
                        </button>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error("載入失敗:", error);
                document.getElementById("job-container").innerHTML = "<p style='color:red;'>無法連接至資料庫，請檢查 GAS 網址。</p>";
            });
        // 綁定在「查看應徵者」按鈕上的功能
function loadResumes(jobName) {
    const container = document.getElementById("job-container");
    container.innerHTML = "<p>🔍 正在調閱履歷資料...</p>";
    
    // 加上 ?action=resumes 呼叫履歷資料
    fetch(GAS_URL + "?action=resumes")
        .then(res => res.json())
        .then(data => {
            container.innerHTML = `<button onclick="location.reload()" style="margin-bottom:15px;">⬅️ 返回職缺清單</button><br>`;
            
            // 只過濾出該門市、該職缺的應徵者
            const applicants = data.filter(r => r["所屬門市"] === currentStore && r["職缺名稱"] === jobName);
            
            if(applicants.length === 0) {
                container.innerHTML += "<p>目前尚無應徵者。</p>";
                return;
            }
            
            applicants.forEach(app => {
                // 這裡套用您最擅長的精美 UI 魔法
                container.innerHTML += `
                    <div class="job-card" style="display:flex; gap:15px; align-items:center;">
                        <img src="${app["大頭貼"] || 'https://via.placeholder.com/60'}" style="width:60px; height:60px; border-radius:50%; object-fit:cover;">
                        <div>
                            <h4 style="margin:0;">${app["求職者姓名"]} <span class="status-badge">${app["狀態"]}</span></h4>
                            <p style="font-size:12px; color:#666; margin:5px 0;">${app["學歷"]}</p>
                            <a href="${app["104專屬網址"]}" target="_blank" style="font-size:12px; color:#3498db; text-decoration:none;">💬 前往 104 傳送訊息</a>
                        </div>
                    </div>
                `;
            });
        });
}
  
    </script>
</body>
</html>
